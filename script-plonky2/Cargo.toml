[package]
name = "zkcoins-prover-plonky2"
version = "0.0.1"
edition = "2021"

[dependencies]
zkcoins-program-plonky2 = { path = "../program-plonky2" }
shared = { path = "../shared" }
plonky2 = "1.1.0"
anyhow = "1.0"
bincode = "1.3"
num = "0.4"
serde = { workspace = true }
sha2 = { workspace = true }
bitcoin = { workspace = true }
# Must share the workspace `bitcoin` 0.32.x line — bitcoincore-rpc 0.19
# depends on bitcoin ^0.32.0 and Cargo unifies to a single 0.32.x instance.
bitcoincore-rpc = "0.19.0"

[dev-dependencies]
# Integration tests (`tests/*`) are separate crates and cannot see package
# dependencies unless listed here.
zkcoins-program-plonky2 = { path = "../program-plonky2" }
shared = { path = "../shared" }
plonky2 = "1.1.0"
num = "0.4"
sha2 = { workspace = true }
# Compile-fail evidence that a hollow `ProvedPendingTransition` cannot be
# minted outside the prove path / `test-utils` feature.
trybuild = "1.0"

[features]
# Test-only APIs (hollow proved-envelope mint for race tests in dependents).
# Dependents must enable this only via `[dev-dependencies]` so production
# builds never see `ProvedPendingTransition::from_parts_for_test`.
test-utils = []
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
