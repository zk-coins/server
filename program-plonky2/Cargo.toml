[package]
name = "zkcoins-program-plonky2"
version = "0.0.1"
edition = "2021"

[dependencies]
plonky2 = "1.1.0"
anyhow = "1.0"
num = "0.4"
serde = { workspace = true }
bincode = { workspace = true }
itertools = { version = "0.11", default-features = false, features = ["use_alloc"] }

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
secp256k1 = { version = "0.29", features = ["rand-std"] }
sha2 = { workspace = true }
# `test-fixtures` exposes `shared::spec_v1::nflog_boundary` (independent
# RFC-6962 reference + V.11 boundary fixtures) for the gadget differential
# suite only — never a production dependency of this crate.
shared = { path = "../shared", features = ["test-fixtures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
